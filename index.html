      overflow-x:hidden;
    }
    .shell{
      max-width: 1480px;
      margin: 0 auto;
      padding: 28px;
    }
    .topbar{
      display:flex;
      gap:16px;
      justify-content:space-between;
      align-items:flex-start;
      margin-bottom:18px;
    }
    .brand{
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .title-row{
      display:flex;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
    }
    .eyebrow{
      letter-spacing:.18em;
      text-transform:uppercase;
      font-size:12px;
      color:var(--muted);
    }
    h1{
      margin:0;
      font-family: "SimHei","Heiti SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
      font-size: clamp(30px, 4vw, 54px);
      line-height:1;
      letter-spacing:-.03em;
      font-weight:900;
    }
    .subhead{
      color:var(--muted);
      font-size:14px;
      max-width: 760px;
      line-height:1.7;
    }
    .status{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:8px;
      color:var(--muted);
      min-width: 220px;
      text-align:right;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 14px;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(255,255,255,.04);
      backdrop-filter: blur(10px);
    }
    .dot{
      width:10px;height:10px;border-radius:999px;background:var(--good);
      box-shadow:0 0 0 5px rgba(78,227,160,.12);
    }
    .directory{
      position:sticky;
      top:12px;
      z-index:30;
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin:0;
      padding:6px 8px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:999px;
      background:rgba(8,13,24,.45);
      backdrop-filter: blur(10px);
    }
    .dir-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:9px 12px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      color:var(--text);
      text-decoration:none;
      font-size:13px;
      box-shadow:none;
    }
    .dir-btn:hover{background:rgba(255,255,255,.10)}
    .sku-pills{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin:12px 0 0;
    }
    .sku-chip{
      appearance:none;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.05);
      color:var(--text);
      border-radius:999px;
      padding:8px 12px;
      font-size:13px;
      cursor:pointer;
    }
    .sku-chip.active{
      background:rgba(116,168,255,.22);
      border-color:rgba(116,168,255,.42);
    }
    .platform-section{
      margin-top:18px;
      display:grid;
      gap:16px;
    }
    .section-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:14px;
      flex-wrap:wrap;
    }
    .platform-headline{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    .platform-title{
      margin:0;
      font-size:26px;
      letter-spacing:-.03em;
    }
    .controls, .layout{
      display:grid;
      gap:16px;
    }
    .controls{
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin: 14px 0 16px;
    }
    .field{
      padding:14px 16px;
      border:1px solid var(--line);
      border-radius:18px;
      background:rgba(255,255,255,.05);
      box-shadow: var(--shadow);
      display:flex;
      flex-direction:column;
      gap:8px;
      min-height: 84px;
    }
    .field label{
      font-size:12px;
      color:var(--muted);
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .field select, .field input{
      width:100%;
      border:none;
      outline:none;
      background:transparent;
      color:var(--text);
      font-size:15px;
      appearance:none;
    }
    .layout{
      grid-template-columns: minmax(0, 1.6fr) minmax(320px, .9fr);
      align-items:stretch;
    }
    .stack{
      display:flex;
      flex-direction:column;
      gap:16px;
    }
    .stack > .card{
      flex:1;
    }
    .row{
      display:grid;
      gap:16px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .full-span{
      grid-column: 1 / -1;
    }
    .card{
      position:relative;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:
        linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .card::before{
      content:"";
      position:absolute;
      inset:auto -20% -50% auto;
      width:220px;
      height:220px;
      background: radial-gradient(circle, rgba(116,168,255,.16), transparent 65%);
      pointer-events:none;
    }
    .metric{
      padding:18px;
      min-height:132px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      gap:14px;
    }
    .metric .label{
      color:var(--muted);
      font-size:13px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }
    .metric .value{
      font-size:34px;
      font-weight:700;
      letter-spacing:-.04em;
    }
    .metric .delta{
      font-size:13px;
      color:var(--muted);
    }
    .positive{color:var(--good)}
    .negative{color:var(--bad)}
    .panel{
      padding:18px;
    }
    .panel-header{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:12px;
      margin-bottom:14px;
    }
    .panel-title{
      margin:0;
      font-size:18px;
      letter-spacing:-.02em;
    }
    .panel-desc{
      color:var(--muted);
      font-size:13px;
    }
    .review-search{
      min-width:min(320px, 100%);
      display:flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border:1px solid var(--line);
      border-radius:14px;
      background:rgba(255,255,255,.05);
    }
    .review-search input{
      width:100%;
      border:none;
      outline:none;
      background:transparent;
      color:var(--text);
      font-size:14px;
    }
    .review-search input::placeholder{
      color:var(--muted);
    }
    .chart-wrap{
      height:340px;
    }
    svg{display:block;width:100%;height:100%}
    .legend{
      display:flex;
      gap:14px;
      flex-wrap:wrap;
      color:var(--muted);
      font-size:12px;
    }
    .legend span{
      display:inline-flex;
      align-items:center;
      gap:6px;
    }
    .legend i{
      width:12px;height:12px;border-radius:4px;display:inline-block;
    }
    .side-top{
      display:grid;
      gap:16px;
    }
    .topic-list{
      display:grid;
      gap:12px;
    }
    .topic{
      display:grid;
      gap:8px;
    }
    .topic-head{
      display:flex;
      justify-content:space-between;
      color:var(--muted);
      font-size:13px;
    }
    .bar{
      height:10px;
      border-radius:999px;
      background:rgba(255,255,255,.07);
      overflow:hidden;
    }
    .bar > span{
      display:block;
      height:100%;
      border-radius:inherit;
      background:linear-gradient(90deg, var(--bad), var(--warn));
    }
    /* 评价分析（替代原关键词热区） */
    .ana{
      flex:1;
      min-height:0;
      margin-top:14px;
      display:flex;
      flex-direction:column;
      gap:14px;
      overflow:auto;
    }
    .ana-kpis{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }
    .ana-kpis-single{grid-template-columns:1fr}
    .ana-kpi{
      border:1px solid rgba(255,255,255,.10);
      border-radius:14px;
      padding:12px 14px;
      background:rgba(255,255,255,.04);
      display:flex;
      flex-direction:column;
      gap:4px;
    }
    .ana-kpi .k{font-size:12px;color:var(--muted);letter-spacing:.04em}
    .ana-kpi .v{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
    .ana-kpi .v.bad{color:var(--bad)}
    .ana-kpi .v.good{color:var(--good)}
    .ana-kpi .d{font-size:12px;color:rgba(255,255,255,.62)}
    .ana-sub{
      font-size:12px;
      color:var(--muted);
      letter-spacing:.04em;
      display:flex;
      justify-content:space-between;
      gap:8px;
    }
    .ana-bars{display:flex;flex-direction:column;gap:9px}
    .ana-bar-row{display:flex;flex-direction:column;gap:5px}
    .ana-bar-top{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:rgba(255,255,255,.86)}
    .ana-bar-top em{font-style:normal;color:rgba(255,255,255,.55)}
    .ana-track{height:7px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
    .ana-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--bad),var(--warn))}
    .ana-note{
      font-size:12.5px;
      line-height:1.7;
      color:rgba(255,255,255,.78);
      border-left:2px solid rgba(255,107,122,.55);
      padding-left:10px;
    }
    .hotwords{
      position:relative;
      min-height:250px;
      padding:6px 4px 2px;
      overflow:hidden;
    }
    .tag{
      position:absolute;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      white-space:nowrap;
      line-height:1;
      font-weight:700;
      letter-spacing:-.02em;
      text-shadow:0 1px 0 rgba(0,0,0,.18);
      user-select:none;
      transform:translate(-50%,-50%);
    }
    .word-tip{
      position:absolute;
      z-index:2;
      left:0;
      top:0;

  <script src="./data-template.js?v=20261106-03"></script>
  <script>
    const fmt = new Intl.NumberFormat("zh-CN");
    const clone = (value) => JSON.parse(JSON.stringify(value));
    const slug = (text) => text.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g, "-");
    const latestUpdated = (platforms) => {
      const stamps = platforms.flatMap((p) => p.skus.map((s) => s.updatedAt).filter(Boolean));
      return stamps.sort().at(-1) ?? "-";
    };
    const toDateValue = (value) => {
      if (!value) return null;
      const text = String(value).trim().split(/[ T]/)[0];
      let match = text.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (match) return Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
      match = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (match) return Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
      match = text.match(/^(\d{1,2})[.-](\d{1,2})$/);
      if (match) return Date.UTC(2026, Number(match[1]) - 1, Number(match[2]));
      return null;
    };
    const shortDate = (value) => {
      if (!value) return "-";
      const text = String(value).trim().split(/[ T]/)[0];
      let match = text.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (match) return `${match[2]}-${match[3]}`;
      match = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (match) return `${String(match[2]).padStart(2, "0")}-${String(match[3]).padStart(2, "0")}`;
      match = text.match(/^(\d{1,2})[.-](\d{1,2})$/);
      if (match) return `${String(match[1]).padStart(2, "0")}-${String(match[2]).padStart(2, "0")}`;
      return text;
    };
    const parseCountValue = (value) => {
      if (value == null || value === "") return null;
      if (typeof value === "number") return Number.isFinite(value) ? value : null;
      const text = String(value).trim();
      if (!text || text === "-" || text === "未展示") return null;
      const cleaned = text.replace(/[^\d.-]/g, "");
      if (!cleaned) return null;
      const num = Number(cleaned);
      return Number.isFinite(num) ? num : null;
    };
    const parsePercentValue = (value) => {
      if (value == null || value === "") return null;
      if (typeof value === "number") return Number.isFinite(value) ? value : null;
      const text = String(value).trim();
      if (!text || text === "-" || text === "未展示") return null;
      const cleaned = text.replace(/%/g, "").replace(/[^\d.-]/g, "");
      if (!cleaned) return null;
      const num = Number(cleaned);
      return Number.isFinite(num) ? num / 100 : null;
    };
    const formatMaybeCount = (value) => {
      if (value == null || value === "") return "-";
      if (typeof value === "string" && value.includes("+")) return value;
      const num = Number(value);
      return Number.isFinite(num) ? fmt.format(num) : String(value);
    };
    const currentReviewsValue = (row) => {
      if (!row) return null;
      if (typeof row.reviews === "number") return row.reviews;
      const parsed = parseCountValue(row.reviews ?? row.reviewsText);
      if (parsed != null) return parsed;
      if (typeof row.good === "number" && typeof row.bad === "number") return row.good + row.bad + (typeof row.neutral === "number" ? row.neutral : 0);
      return null;
    };
    const currentGoodRate = (row) => {
      if (!row) return null;
      if (typeof row.goodRate === "number") return row.goodRate;
      const parsed = parsePercentValue(row.goodRate ?? row.goodRateText);
      if (parsed != null) return parsed;
      if (typeof row.good === "number") {
        const reviews = currentReviewsValue(row);
        return reviews ? row.good / reviews : null;
      }
      return null;
    };
    const currentBadCount = (row) => {
      if (!row) return null;
      if (typeof row.bad === "number") return row.bad;
      const parsed = parseCountValue(row.bad ?? row.badText);
      if (parsed != null) return parsed;
      return null;
    };
    const formatDelta = (current, previous, digits = 0, unit = "", scale = 1) => {
      if (current == null || previous == null) return "较昨日-";
      const diff = (current - previous) * scale;
      const factor = 10 ** digits;
      // 保留“截断不四舍五入”，同时加一点容差避免浮点误差把 0.03 截成 0.02。
      const adjusted = diff * factor + (diff >= 0 ? 1e-9 : -1e-9);
      const truncated = Math.trunc(adjusted) / factor;
      if (truncated === 0) return "较昨日-";
      const sign = truncated > 0 ? "+" : "";
      return `较昨日 ${sign}${truncated.toFixed(digits)}${unit}`;
    };
    const cloudPalette = [
      "rgba(255,255,255,.96)",
      "rgba(116,168,255,.96)",
      "rgba(78,227,160,.94)",

      "rgba(156,123,255,.94)"
    ];
    const cloudMeasureCanvas = document.createElement("canvas");
    const cloudMeasureCtx = cloudMeasureCanvas.getContext("2d");
    const cloudFontFamily = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei",sans-serif';
    const cloudCollision = (a, b) => !(
      a.right < b.left ||
      a.left > b.right ||
      a.bottom < b.top ||
      a.top > b.bottom
    );
    const cloudMeasure = (text, size) => {
      cloudMeasureCtx.font = `700 ${size}px ${cloudFontFamily}`;
      const metrics = cloudMeasureCtx.measureText(text);
      return {
        width: Math.ceil(metrics.width + size * 0.56),
        height: Math.ceil(size * 1.32)
      };
    };
    const cloudFits = (rect, width, height, margin) => (

    const makeSku = (skuName, overrides = {}) => ({

        { date: "08-24 11:26", city: "杭州", user: "小雨", channel: "小时达", category: "客服响应", score: 2, content: "反馈后响应稍慢，希望能更快处理售后。", status: "已跟进" },

    const DEFAULT_DATA = {
      platforms: [
        {
          name: "小象",
          skus: [
            makeSku("鲜切草莓 500g"),

        }

    };

    const data = window.__DASHBOARD_DATA__ ?? clone(DEFAULT_DATA);
    const state = Object.fromEntries(data.platforms.map((platform) => [platform.name, platform.skus[0]?.skuName ?? ""]));
    const $ = (id) => document.getElementById(id);

    function getPlatform(name) {
      return data.platforms.find((platform) => platform.name === name) ?? data.platforms[0];
    }

    function getSku(platformName) {
      const platform = getPlatform(platformName);
      return platform.skus.find((sku) => sku.skuName === state[platformName]) ?? platform.skus[0];
    }

    function initSelect(el, values, current) {

      return `

    function renderChart(svg, rows) {
      const plotRows = rows.filter((row) => currentGoodRate(row) != null);
      if (!plotRows.length) {
        svg.innerHTML = `
          <text x="50%" y="50%" text-anchor="middle" fill="rgba(255,255,255,.55)" font-size="14">暂无趋势数据</text>
        `;
        return;
      }
      const w = 940;
      const h = 340;
      const pad = { top: 24, right: 64, bottom: 42, left: 66 };
      const innerW = w - pad.left - pad.right;
      const innerH = h - pad.top - pad.bottom;
      const goodRates = plotRows.map((row) => currentGoodRate(row) ?? 0);
      const minRate = Math.min(...goodRates);
      const maxRate = Math.max(...goodRates);
      const range = Math.max(maxRate - minRate, 0.0001);
      const padRate = Math.max(range * 1.2, 0.008);
      const yMin = Math.max(0, minRate - padRate);
      const yMax = Math.min(1, maxRate + padRate);
      const yRange = Math.max(yMax - yMin, 0.0001);
      const xStep = plotRows.length > 1 ? innerW / (plotRows.length - 1) : innerW;

      const points = goodRates.map((rate, index) => [
        pad.left + index * xStep,
        pad.top + ((yMax - rate) / yRange) * innerH
      ]);
      const goodLine = points.map((point, index) => `${index === 0 ? "M" : "L"} ${point[0]} ${point[1]}`).join(" ");

      const ticks = [0, 0.25, 0.5, 0.75, 1];
      const grid = ticks
        .map((tick) => {
          const y = pad.top + innerH * tick;
          return `<line x1="${pad.left}" y1="${y}" x2="${w - pad.right}" y2="${y}" stroke="rgba(255,255,255,.08)" />`;
        })
        .join("");
      const yLabels = ticks
        .map((tick) => {
          const value = yMax - tick * yRange;
          return `<text x="${pad.left - 10}" y="${pad.top + innerH * tick + 4}" text-anchor="end" fill="rgba(255,255,255,.6)" font-size="11">${(value * 100).toFixed(1)}%</text>`;
        })
        .join("");

      const labels = plotRows
        .map((row, index) => `<text x="${pad.left + index * xStep}" y="${h - 16}" text-anchor="middle" fill="rgba(255,255,255,.6)" font-size="11">${shortDate(row.date)}</text>`)
        .join("");

      const pointLabels = points
        .map((point, index) => {
          const text = plotRows[index].goodRateText ?? `${(goodRates[index] * 100).toFixed(2)}%`;
          const labelY = Math.max(pad.top + 10, point[1] - 12);
          return `
            <text x="${point[0]}" y="${labelY}" text-anchor="middle" fill="rgba(255,255,255,.82)" font-size="10" font-weight="600">${text}</text>
            <circle cx="${point[0]}" cy="${point[1]}" r="4.2" fill="var(--good)" stroke="rgba(255,255,255,.95)" stroke-width="1.5">
              <title>${shortDate(plotRows[index].date)}：${text}</title>
            </circle>
          `;
        })
        .join("");

      svg.innerHTML = `
        ${grid}
        <line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${h - pad.bottom}" stroke="rgba(255,255,255,.10)" />
        <line x1="${pad.left}" y1="${h - pad.bottom}" x2="${w - pad.right}" y2="${h - pad.bottom}" stroke="rgba(255,255,255,.10)" />
        ${yLabels}
        <path d="${goodLine}" fill="none" stroke="var(--good)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
        ${pointLabels}
        ${labels}
      `;
    }

    // 评价分析：本周（自周一）新增差评 + 差评标签分布 + 结论
    function renderAnalysis(container, daily, reviews) {
      if (!container) return;
      const sorted = [...(Array.isArray(daily) ? daily : [])].sort(
        (a, b) => (toDateValue(a.date) ?? 0) - (toDateValue(b.date) ?? 0)
      );
      const today = sorted.at(-1) ?? null;

      // 以「本周一」的数据为基准：本周新增差评 = 今日差评数 − 周一差评数
      const mondayOf = (iso) => {
        const [y, m, d] = String(iso).split("-").map(Number);
        if (!y || !m || !d) return null;
        const base = Date.UTC(y, m - 1, d);
        const offset = (new Date(base).getUTCDay() + 6) % 7; // 0=周一
        return new Date(base - offset * 86400000).toISOString().slice(0, 10);
      };
      const weekStart = today ? mondayOf(today.date) : null;
      const baseline = weekStart
        ? [...sorted].reverse().find((row) => String(row.date) <= weekStart) ?? null
        : null;

      const badNow = today ? currentBadCount(today) : null;
      const badBase = baseline ? currentBadCount(baseline) : null;
      const newBad = badNow != null && badBase != null ? Math.round(badNow - badBase) : null;

      const md = (iso) => (iso ? `${Number(iso.slice(5, 7))}-${iso.slice(8, 10)}` : "-");

      // 差评标签分布
      const tagCount = new Map();
      let tagged = 0;
      for (const review of Array.isArray(reviews) ? reviews : []) {
        const raw = String(review.tag ?? "").trim();
        if (!raw || raw === "-") continue;
        let hit = false;
        for (const part of raw.split(/[，,、]/)) {
          const word = part.trim();
          if (!word) continue;
          tagCount.set(word, (tagCount.get(word) ?? 0) + 1);
          hit = true;
        }
        if (hit) tagged += 1;
      }
      const topTags = [...tagCount.entries()].sort((a, b) => b[1] - a[1]).slice(0, 4);

      if (!today && !topTags.length) {
        container.innerHTML = `<div class="muted">暂无评价数据</div>`;
        return;
      }

      const kpiBad = newBad == null ? "-" : `${newBad}`;
      const kpiBadHint = baseline
        ? `自 ${md(baseline.date)}（周一）起`
        : "暂无本周基准数据";

      const bars = topTags.length
        ? topTags
            .map(([word, count]) => {
              const pct = tagged ? Math.round((count / tagged) * 100) : 0;
              return `
                <div class="ana-bar-row">
                  <div class="ana-bar-top"><span>${word}</span><em>${count} 次 · ${pct}%</em></div>
                  <div class="ana-track"><div class="ana-fill" style="width:${Math.max(pct, 3)}%"></div></div>
                </div>`;
            })
            .join("")
        : `<div class="muted" style="font-size:12.5px">暂无差评标签数据</div>`;

      let conclusion;
      if (!topTags.length && newBad == null) {
        conclusion = "该 SKU 暂无差评明细，暂无可分析的差评结构。";
      } else {
        const parts = [];
        if (newBad != null) {
          parts.push(`本周新增差评 ${newBad} 条（自 ${md(baseline.date)} 起）`);
        }
        if (topTags.length) {
          const pct = tagged ? Math.round((topTags[0][1] / tagged) * 100) : 0;
          parts.push(`差评主要集中在「${topTags[0][0]}」（${pct}%）`);
        }
        conclusion = parts.join("；") + "。";
      }

      container.innerHTML = `
        <div class="ana-kpis ana-kpis-single">
          <div class="ana-kpi">
            <span class="k">本周新增差评</span>
            <b class="v bad">${kpiBad}</b>
            <span class="d">${kpiBadHint}</span>
          </div>
        </div>
        <div class="ana-sub"><span>差评标签分布</span></div>
        <div class="ana-bars">${bars}</div>
        <div class="ana-note">${conclusion}</div>
      `;
    }

    const searchQueries = Object.fromEntries(data.platforms.map((platform) => [platform.name, ""]));

    function reviewLabel(review) {
      const text = String(review.tag ?? review.category ?? "").trim();
      if (!text || text === "-") return `<span class="review-label empty">-</span>`;
      return `<span class="review-label">${text}</span>`;
    }

    function normalizeSearchText(value) {
      return String(value ?? "")
        .toLowerCase()
        .replace(/[\s,，、;；|/]+/g, " ")
        .trim();
    }

    function reviewSearchHaystack(review) {
      return normalizeSearchText([
        review.date,
        shortDate(review.date),
        review.city,
        review.user,
        review.tag,
        review.category,
        review.content
      ].join(" "));
    }

    function reviewMatchesQuery(review, query) {
      const tokens = normalizeSearchText(query).split(" ").filter(Boolean);
      if (!tokens.length) return true;
      const haystack = reviewSearchHaystack(review);
      return tokens.every((token) => {
        if (haystack.includes(token)) return true;
        let from = 0;
        for (const char of token) {
          const index = haystack.indexOf(char, from);
          if (index === -1) return false;
          from = index + 1;
        }
        return true;
      });
    }

    const escapeAttr = (value) =>
      String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

    function renderReviews(container, reviews, query = "") {
      const matched = reviews.filter((review) => reviewMatchesQuery(review, query));
      const count = $(`review-count-${container.id.replace("reviews-", "")}`);
      if (count) {
        count.textContent = query.trim()
          ? `找到 ${matched.length} / ${reviews.length} 条，匹配“${query.trim()}”`
          : `该 SKU 的差评文本明细，共 ${reviews.length} 条。`;
      }
      if (!reviews.length) {
        container.innerHTML = `<tr><td colspan="5" class="muted">暂无差评明细</td></tr>`;
        return;
      }
      container.innerHTML = matched.length
        ? matched
            .map((review) => {
              const tagText = String(review.tag ?? review.category ?? "").trim() || "-";
              const contentText = String(review.content ?? "-");
              return `
                <tr>
                  <td>${shortDate(review.date)}</td>
                  <td>${review.city ?? "-"}</td>
                  <td>${review.user ?? "-"}</td>
                  <td class="cell-tag" data-full-tag="${escapeAttr(tagText)}">${reviewLabel(review)}</td>
                  <td class="cell-content" data-full-tag="${escapeAttr(contentText)}">${contentText}</td>
                </tr>
              `;
            })
            .join("")
        : `<tr><td colspan="5" class="muted">没有包含“${query.trim()}”的差评明细</td></tr>`;
    }

    function bindReviewSearch(platformName) {
      const input = $(`review-search-${slug(platformName)}`);
      if (!input) return;
      input.value = searchQueries[platformName] ?? "";
      input.oninput = () => {
        searchQueries[platformName] = input.value;
        renderReviews($(`reviews-${slug(platformName)}`), getSku(platformName).reviews ?? [], input.value);
      };
    }

    function renderSkuChips(container, platformName, platform) {
      container.innerHTML = platform.skus
        .map(
          (sku) => `
            <button class="sku-chip ${state[platformName] === sku.skuName ? "active" : ""}" data-sku="${sku.skuName}">${sku.skuName}</button>
          `
        )
        .join("");
      container.querySelectorAll(".sku-chip").forEach((button) => {
        button.onclick = () => {
          state[platformName] = button.dataset.sku;
          renderSection(platformName);
        };
      });
    }

    function renderMetrics(container, rows) {
      const today = rows.at(-1) ?? null;
      const yesterday = rows.at(-2) ?? null;
      const todayReviews = currentReviewsValue(today);
      const yesterdayReviews = currentReviewsValue(yesterday);
      const todayGoodRate = currentGoodRate(today);
      const yesterdayGoodRate = currentGoodRate(yesterday);
      const todayBad = currentBadCount(today);
      const yesterdayBad = currentBadCount(yesterday);

      container.innerHTML = [
        metricCard("评价数量", formatMaybeCount(today?.reviewsText ?? todayReviews), { label: "较昨日", text: formatDelta(todayReviews, yesterdayReviews) }),
        metricCard("好评率", today?.goodRateText ?? (todayGoodRate == null ? "-" : `${(todayGoodRate * 100).toFixed(2)}%`), { label: "较昨日", text: formatDelta(todayGoodRate, yesterdayGoodRate, 2, "%", 100) }, "positive"),
        metricCard("差评数量", formatMaybeCount(today?.badText ?? todayBad), { label: "较昨日", text: formatDelta(todayBad, yesterdayBad) }, "negative")
      ].join("");
    }

    function renderSection(platformName) {
      const platform = getPlatform(platformName);
      const sku = getSku(platformName);
      const key = slug(platformName);
      const rows = [...(sku.daily ?? [])].sort((a, b) => (toDateValue(a.date) ?? 0) - (toDateValue(b.date) ?? 0)).slice(-14);

      renderSkuChips($(`chips-${key}`), platformName, platform);
      renderMetrics($(`metrics-${key}`), rows);
      renderChart($(`chart-${key}`), rows);
      renderAnalysis($(`ana-${key}`), sku.daily ?? [], sku.reviews ?? []);
      bindReviewSearch(platformName);
      renderReviews($(`reviews-${key}`), sku.reviews ?? [], searchQueries[platformName] ?? "");
    }

    function renderAll() {
      renderDirectory();
      $("sections").innerHTML = data.platforms.map((platform) => sectionMarkup(platform)).join("");
      data.platforms.forEach((platform) => renderSection(platform.name));
      $("updatedAt").textContent = latestUpdated(data.platforms);
      $("refreshText").textContent = window.__DASHBOARD_DATA__ ? "数据状态：已接入外部数据" : "数据状态：样例数据";
    }

    let resizeRaf = 0;
    window.addEventListener("resize", () => {
      cancelAnimationFrame(resizeRaf);
      resizeRaf = requestAnimationFrame(() => {
        data.platforms.forEach((platform) => renderSection(platform.name));
      });
    });

    // 被折叠的单元格：鼠标悬停时浮出完整文字
    const cellTip = $("cellTip");
    let tipCell = null;

    function isTruncated(cell) {
      if (!cell) return false;
      const pill = cell.querySelector(".review-label");
      if (pill) return pill.scrollWidth > pill.clientWidth + 1;
      return cell.scrollWidth > cell.clientWidth + 1;
    }

    function placeTip(event) {
      if (!cellTip || cellTip.hidden) return;
      const gap = 14;
      const rect = cellTip.getBoundingClientRect();
      let x = event.clientX + gap;
      let y = event.clientY + gap + 6;
      if (x + rect.width > window.innerWidth - gap) x = Math.max(gap, window.innerWidth - rect.width - gap);
      if (y + rect.height > window.innerHeight - gap) y = Math.max(gap, event.clientY - rect.height - gap);
      cellTip.style.left = `${Math.round(x)}px`;
      cellTip.style.top = `${Math.round(y)}px`;
    }

    function hideTip() {
      if (!cellTip) return;
      cellTip.classList.remove("show");
      cellTip.hidden = true;
      cellTip.textContent = "";
      tipCell = null;
    }

    document.addEventListener("mouseover", (event) => {
      const cell = event.target?.closest?.("td[data-full-tag]");
      if (!cell || !isTruncated(cell)) return;
      const text = cell.dataset.fullTag || "";
      if (!text) return;
      tipCell = cell;
      cellTip.textContent = text;
      cellTip.hidden = false;
      placeTip(event);
      requestAnimationFrame(() => cellTip.classList.add("show"));
    });

    document.addEventListener("mousemove", (event) => {
      if (tipCell && cellTip && !cellTip.hidden) placeTip(event);
    });

    document.addEventListener("mouseout", (event) => {
      if (!tipCell) return;
      const to = event.relatedTarget;
      if (to instanceof Node && tipCell.contains(to)) return;
      hideTip();
    });

    document.addEventListener("scroll", () => { if (tipCell) hideTip(); }, true);
    window.addEventListener("blur", hideTip);

    renderAll();
  </script>
</body>
</html>
